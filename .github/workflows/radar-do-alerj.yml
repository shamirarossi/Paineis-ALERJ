name: Radar DO ALERJ - leitura diária (Dani Balbi e Vinicius Cozzolino)

on:
  schedule:
    # Dias úteis, horário de Brasília (UTC-3): 7h37, 8h47, 9h53, 11h17 e 13h41.
    # O GitHub às vezes atrasa ou descarta execuções agendadas em horário de pico, por isso há
    # várias tentativas. Quando a edição do dia já foi lida, a execução termina em segundos,
    # sem chamar o Claude e sem gravar nada.
    - cron: "37 10 * * 1-5"
    - cron: "47 11 * * 1-5"
    - cron: "53 12 * * 1-5"
    - cron: "17 14 * * 1-5"
    - cron: "41 16 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Data da edição (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""
      forcar:
        description: "Reler mesmo que a edição já esteja no painel"
        type: boolean
        default: false
      gabinete:
        description: "Para qual painel ler. O automático lê só o da Dani; o do Vinicius é sob demanda."
        type: choice
        options: [Dani, Vinicius, Os dois]
        default: Dani

permissions:
  contents: write

concurrency:
  group: radar-do-alerj
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar-do-alerj/requirements.txt

      - name: Instalar dependências
        run: |
          # poppler (pdftotext) é preferido; se o servidor de pacotes do Ubuntu falhar, o robô usa o pypdf
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) || echo "::warning::poppler-utils não instalou; usando pypdf para ler o PDF."
          pip install -r radar-do-alerj/requirements.txt

      - name: Ler a Parte II do dia
        id: leitura
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}
          DATA: ${{ inputs.data }}
          FORCAR: ${{ inputs.forcar }}
          GABINETE: ${{ inputs.gabinete }}
        run: |
          case "$GABINETE" in
            Vinicius) export GABINETES=vc ;;
            "Os dois") export GABINETES=dani,vc ;;
            *) export GABINETES=dani ;;
          esac
          ARGS=""
          if [ -n "$DATA" ]; then ARGS="$ARGS --data $DATA"; fi
          if [ "$FORCAR" = "true" ]; then ARGS="$ARGS --forcar"; fi
          if python radar-do-alerj/scripts/ler_do.py $ARGS; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - name: Ler a Ordem do Dia (painel da Dani)
        # Pautas das sessões publicadas no site da ALERJ. Só chama o Claude quando uma pauta muda.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}
        run: python radar-do-alerj/scripts/ordem_do_dia.py || echo "::warning::Alguma pauta da Ordem do Dia não foi lida; tenta de novo no próximo horário."

      - name: Gerar relatórios em PDF (painel da Dani)
        # O Chrome já vem instalado no runner do GitHub. Só gera o PDF de edições novas ou relidas.
        run: python radar-do-alerj/scripts/relatorio_pdf.py || echo "::warning::Algum relatório em PDF não foi gerado; o painel segue funcionando."

      - name: Publicar no painel
        run: |
          git config user.name "radar-do[bot]"
          git config user.email "radar-do@users.noreply.github.com"
          git add leituras radar-do-alerj/data radar-do-alerj/relatorios radar-vinicius-cozzolino/data
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Leitura do Diário Oficial de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git pull --rebase --quiet && git push
          fi

      - name: Avisar falha
        if: steps.leitura.outputs.ok != '1'
        run: |
          echo "::error::A leitura falhou. Veja a mensagem no passo 'Ler a Parte II do dia'. O aviso também aparece no topo do painel."
          exit 1
