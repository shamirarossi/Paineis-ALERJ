name: Radar DO ALERJ - leitura diária

on:
  schedule:
    # Dias úteis às 8h47 e, de reserva, às 11h17 (horário de Brasília, UTC-3).
    # A segunda execução só lê se a edição ainda não estiver no painel.
    - cron: "47 11 * * 1-5"
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Data da edição (AAAA-MM-DD). Vazio = hoje."
        required: false
        default: ""
      forcar:
        description: "Reler mesmo que a edição já esteja no painel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-do-alerj
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar-do-alerj/requirements.txt

      - name: Instalar dependências
        run: |
          # poppler (pdftotext) é preferido; se o servidor de pacotes do Ubuntu falhar, o robô usa o pypdf
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) || echo "::warning::poppler-utils não instalou; usando pypdf para ler o PDF."
          pip install -r radar-do-alerj/requirements.txt

      - name: Ler a Parte II do dia
        id: leitura
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}
          DATA: ${{ inputs.data }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          ARGS=""
          if [ -n "$DATA" ]; then ARGS="$ARGS --data $DATA"; fi
          if [ "$FORCAR" = "true" ]; then ARGS="$ARGS --forcar"; fi
          if python radar-do-alerj/scripts/ler_do.py $ARGS; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar no painel
        run: |
          git config user.name "radar-do[bot]"
          git config user.email "radar-do@users.noreply.github.com"
          git add radar-do-alerj/data
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Leitura do Diário Oficial de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git pull --rebase --quiet && git push
          fi

      - name: Avisar falha
        if: steps.leitura.outputs.ok != '1'
        run: |
          echo "::error::A leitura falhou. Veja a mensagem no passo 'Ler a Parte II do dia'. O aviso também aparece no topo do painel."
          exit 1
